# Render Blueprint (https://render.com/docs/blueprint-spec) – kostenloses Hosting für das Backend.
# Bewusst OHNE Postgres: Die Datenbank ist nur ein Cache (Suchen, OpenSky-Abflüge, Flugzeugregister); Referenzdaten
# werden bei jedem Start neu geladen. SQLite im Container genügt – keine ablaufende Free-Datenbank.
# Einrichtung: siehe docs/DEPLOYMENT.md. Tokens im Render-Dashboard setzen (sync: false).
services:
  - type: web
    name: aviation-trip-optimizer-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/aviation.db
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://atomkarnickel.github.io
      - key: DEMO_MODE
        value: "false"
