name: APK und App Bundle bauen

# Baut bei jedem Push (jeder Branch) und manuell eine signierte APK + App Bundle.
# Download: Actions → Lauf öffnen → ganz unten „Artifacts“ → Aviation-APK.
# Offizielle, dauerhafte Downloads entstehen über Tags (release.yml → GitHub Releases).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore aus Secrets bereitstellen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 fehlt – APK wird unsigniert gebaut und ist nicht installierbar."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK und App Bundle bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Signatur prüfen
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/sig.txt"
          if [ -n "$EXPECTED_CERT" ]; then
            ACTUAL=$(grep -m1 -E "Signer( #1|:) certificate SHA-256 digest" "$RUNNER_TEMP/sig.txt" | awk '{print $NF}')
            EXPECTED=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "::error::Falsches Signaturzertifikat – Updates wären nicht installierbar."; exit 1; }
          fi
          (cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: Aviation-APK
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Aviation-AAB
          path: apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
