name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Lint + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../scripts
      - run: pytest
      - name: OpenAPI-Spezifikation aktuell?
        run: |
          python -c "import json; from app.main import create_app; json.dump(create_app().openapi(), open('/tmp/openapi.json','w',encoding='utf-8'), ensure_ascii=False, indent=1)"
          diff -q /tmp/openapi.json ../shared/openapi.json || (echo "::error::shared/openapi.json ist veraltet – Backend-Schema exportieren (siehe docs/DEVELOPMENT.md)" && exit 1)
      - name: Docker-Image baut
        run: docker build -t aviation-backend:ci -f Dockerfile ..

  web:
    name: Web (Typprüfung, Lint, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  android:
    name: Android (Unit-Tests, Lint, Debug-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests
            apps/android/app/build/reports/lint-results-debug.html
          retention-days: 7
