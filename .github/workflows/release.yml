name: Release

# Auslöser: Push eines Tags vX.Y.Z (stabil) oder vX.Y.Z-suffix (Vorabversion).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag und Version prüfen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' ist kein gültiges SemVer-Tag (vX.Y.Z)."; exit 1
          fi
          CORE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$CORE" != "$FILE_VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zur Datei VERSION ($FILE_VERSION). Erst VERSION erhöhen, committen, dann taggen."; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[4]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    name: Tests
    needs: prepare
    uses: ./.github/workflows/ci.yml

  android:
    name: APK bauen, signieren, veröffentlichen
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APK_NAME: aviation-optimizer-${{ needs.prepare.outputs.version }}.apk
    steps:
      - uses: actions/checkout@v4

      - name: Signier-Secrets vorhanden?
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$CERT" ] && missing="$missing (Variable) ANDROID_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Release abgebrochen – fehlende Secrets/Variablen:$missing. Es wird KEINE unsignierte APK veröffentlicht. Siehe docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore bereitstellen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Signatur, Zertifikat und Paketinformationen prüfen
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/signature.txt"
          ACTUAL=$(grep -m1 -E "Signer( #1|:) certificate SHA-256 digest" "$RUNNER_TEMP/signature.txt" | awk '{print $NF}')
          EXPECTED=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signaturzertifikat ($ACTUAL) entspricht nicht dem erwarteten Release-Zertifikat. Updates wären nicht installierbar."; exit 1
          fi
          "$BT/aapt2" dump badging "$APK" | head -1 | tee "$RUNNER_TEMP/badging.txt"
          CODE=$(python3 -c "v='$VERSION'.split('-')[0].split('.'); print(int(v[0])*10000+int(v[1])*100+int(v[2]))")
          grep -q "versionName='${VERSION%%-*}'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='$CODE'" "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.atomkarnickel.aviationoptimizer'" "$RUNNER_TEMP/badging.txt"
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && sha256sum -c "$APK_NAME.sha256")

      - name: GitHub Release erstellen (erst als Entwurf, nach Upload veröffentlichen)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 "dist/$APK_NAME.sha256")
          CERT=$(grep -m1 -E "Signer( #1|:) certificate SHA-256 digest" "$RUNNER_TEMP/signature.txt" | awk '{print $NF}')
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Android-APK

          | Datei | SHA-256 |
          |---|---|
          | \`$APK_NAME\` | \`$SHA\` |

          Signaturzertifikat (SHA-256): \`$CERT\`

          Installation: APK auf dem Android-Gerät öffnen und die Installation selbst bestätigen (ggf. „Unbekannte Apps installieren“ erlauben).
          EOF
          FLAGS="--draft --verify-tag --generate-notes --notes-file $RUNNER_TEMP/notes.md --title v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME existiert bereits. Neues Patch-Release erstellen statt Assets zu überschreiben."; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" $FLAGS "dist/$APK_NAME" "dist/$APK_NAME.sha256"
          # Assets prüfen, bevor der Entwurf veröffentlicht wird
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort | tr '\n' ' ')
          [ "$ASSETS" = "$APK_NAME $APK_NAME.sha256 " ] || { echo "::error::Unerwartete Assets: $ASSETS"; exit 1; }
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

      - name: Veröffentlichten Download prüfen
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"
          for i in 1 2 3 4 5; do
            if curl -fsSL -o "$RUNNER_TEMP/check.apk" "$URL"; then break; fi; sleep 10
          done
          echo "$(cut -d' ' -f1 dist/$APK_NAME.sha256)  $RUNNER_TEMP/check.apk" | sha256sum -c -

  readme:
    name: README-Downloadliste aktualisieren
    needs: [prepare, android]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: README generieren (inkl. Linkprüfung)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_readme.py
      - name: Commit
        run: |
          if git diff --quiet README.md; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: README-Downloads für v${{ needs.prepare.outputs.version }} aktualisieren"
          git push origin HEAD:main

  web:
    name: Webversion deployen
    needs: [prepare, android]
    if: needs.prepare.outputs.prerelease == 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-web.yml
